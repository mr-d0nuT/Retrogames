<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNES Web Emulator</title>
    <!-- Tailwind CSS for layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="antialiased min-h-screen flex flex-col relative">
    
    <!-- Background Design -->
    <div class="fixed inset-0 z-[-1] bg-slate-900">
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')] opacity-50"></div>
        <div class="absolute top-0 w-full h-96 bg-gradient-to-b from-blue-900/20 to-transparent"></div>
    </div>

    <!-- Header -->
    <header class="w-full p-6 text-center relative overflow-hidden flex flex-col items-center">
        <!-- SNES Console Image -->
        <img src="assets/amiga-logo.png" alt="SNES Console" class="mx-auto max-h-40 w-auto object-contain drop-shadow-[0_0_15px_rgba(217,70,239,0.5)] transition-transform duration-500 hover:scale-110 mb-4">
        
        <h1 class="text-4xl md:text-6xl font-retro text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500 mb-2 shadow-sm neon-text-pulse tracking-widest uppercase">
            COMMODORE AMIGA
        </h1>
        </header>

    <!-- Search and Filter Section -->
    <div class="container mx-auto px-4 max-w-6xl mt-2 mb-6">
        <div class="flex flex-col lg:flex-row justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-purple-500/30 shadow-[0_0_15px_rgba(168,85,247,0.2)] backdrop-blur-md gap-6">
            
            <!-- Compact Search and Filter -->
            <div class="flex flex-row w-full justify-center items-center gap-2">
                <div class="relative w-full max-w-sm">
                    <input type="text" id="search-input" placeholder="Buscar..." class="w-full bg-slate-900/80 border border-purple-500/50 rounded-full py-3 px-5 text-slate-100 focus:outline-none focus:border-fuchsia-500 focus:shadow-[0_0_15px_rgba(255,0,255,0.6)] transition-all placeholder-slate-500 font-mono text-sm">
                    <span class="absolute right-4 top-3 text-slate-400">🔍</span>
                </div>
                <select id="alphabet-select" class="bg-slate-900/80 border border-purple-500/50 rounded-full py-3 px-4 text-slate-100 font-mono text-sm focus:outline-none focus:border-fuchsia-500 focus:shadow-[0_0_15px_rgba(255,0,255,0.6)]">
                    <option value="ALL">Todo</option>
                    <option value="#">#</option>
                    <!-- A-Z will be injected by JS -->
                </select>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <div id="games-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- Game cards will be injected here by app.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-6 text-slate-500 text-sm">
        <p>Impulsado por <a href="https://emulatorjs.org/" target="_blank" class="text-blue-400 hover:underline">EmulatorJS</a>.</p>
    </footer>

    <!-- Emulator Modal -->
    <div id="emulator-modal">
        <div id="emulator-header">
            <h2 id="modal-title" class="text-xl font-bold">Cargando...</h2>
            <button id="close-emulator" class="close-btn font-retro text-xs">CERRAR X</button>
        </div>
        <div id="game-container">
            <div id="game"></div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="js/app.js"></script>

    <!-- Melodias de espera (dominio publico, sintetizadas) -->
    <script src="../assets/audio/jukebox.js"></script>
</body>
</html>
